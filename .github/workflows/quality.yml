name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content and HTML checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Link checks
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-mail
            --exclude https://fonts.googleapis.com
            --exclude https://fonts.gstatic.com
            --timeout 20
            ./index.html
            ./README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.13.0 autorun --config=./lighthouserc.json
