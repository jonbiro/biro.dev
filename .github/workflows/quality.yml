name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Content and HTML checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Link checks
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude https://www.linkedin.com
            --exclude https://medium.com
            --exclude https://biro.dev
            --exclude '^https://medium\.com/.*'
            --exclude '^https://www\.linkedin\.com/.*'
            --exclude '^https://x\.com/.*'
            --exclude '^https://biro\.dev/.*'
            --timeout 20
            ./index.html
            ./assets/content.js
            ./robots.txt
            ./sitemap.xml
            ./README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser, keyboard, and accessibility tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.13.0 autorun --config=./lighthouserc.json
